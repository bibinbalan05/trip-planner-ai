# Render Blueprint: deploys the backend (Web Service) and frontend (Static Site).
# Docs: https://render.com/docs/blueprint-spec

services:
  # ---------------------------------------------------------------- Backend
  - type: web
    name: trip-planner-api
    runtime: node
    plan: free
    rootDir: backend
    # `--include=dev` because NODE_ENV=production would otherwise skip devDependencies (TypeScript) at build time.
    # Once package-lock.json is committed you can switch `npm install` to `npm ci`.
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 22
      - key: NODE_ENV
        value: production
      - key: GEMINI_MODEL
        value: gemini-flash-latest
      # Secret: no value here. Render asks for it when the Blueprint is created
      # (and you can change it later under the service's Environment tab).
      - key: GEMINI_API_KEY
        sync: false
      # Must equal the public URL of the static site below. Change it if you rename the site
      # or if Render gives it a different hostname.
      - key: FRONTEND_ORIGIN
        value: https://trip-planner-web.onrender.com

  # --------------------------------------------------------------- Frontend
  - type: web
    name: trip-planner-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    # Angular output: angular.json sets outputPath {base: dist/frontend, browser: browser}.
    # Path is relative to rootDir (frontend/).
    staticPublishPath: dist/frontend/browser
    envVars:
      - key: NODE_VERSION
        value: 22
      # Public URL of the backend above. It is baked into the bundle at build time by
      # scripts/set-api-url.mjs, so changing it requires a redeploy of the static site.
      - key: API_BASE_URL
        value: https://trip-planner-api.onrender.com
    routes:
      # Single-page app: serve index.html for any path.
      - type: rewrite
        source: /*
        destination: /index.html
